server {
    listen 80;
    listen [::]:80;
    server_name chuannong-api.mychangliapp.cn chuannong-admin.mychangliapp.cn chuannong-files.mychangliapp.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chuannong-api.mychangliapp.cn;
    ssl_certificate /etc/letsencrypt/live/mychuannong/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mychuannong/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/mychuannong-api.access.log;
    error_log /var/log/nginx/mychuannong-api.error.log;
    location ^~ /admin { return 404; }
    location ^~ /api/v1/admin/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8792;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chuannong-admin.mychangliapp.cn;
    ssl_certificate /etc/letsencrypt/live/mychuannong/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mychuannong/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/mychuannong-admin.access.log;
    error_log /var/log/nginx/mychuannong-admin.error.log;
    location = / { return 302 /admin/; }
    location / {
        proxy_pass http://127.0.0.1:8792;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chuannong-files.mychangliapp.cn;
    ssl_certificate /etc/letsencrypt/live/mychuannong/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mychuannong/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /var/www/mychuannong-files;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/mychuannong-files.access.log;
    error_log /var/log/nginx/mychuannong-files.error.log;
    location = /health { default_type application/json; return 200 '{"ok":true,"service":"mychuannong-files"}'; }
    location /releases/ { try_files $uri =404; }
    location /resources/ { try_files $uri =404; }
    location / { return 404; }
    location ~ /\. { deny all; }
}
